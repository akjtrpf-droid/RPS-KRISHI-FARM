<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21663d"><title>R.P.S. कृषि फार्म — टेस्ट ऐप</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f6ef;color:#203126;font-family:Arial,sans-serif}header{background:#21663d;color:white;padding:20px 16px;border-radius:0 0 22px 22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:54px;height:54px;border-radius:50%;background:#fff;color:#21663d;display:grid;place-items:center;font-size:28px}h1{font-size:21px;margin:0 0 5px}header p{margin:0;color:#e0efdf;font-size:13px}main{max-width:650px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d5e5d5;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 7px #173d1710}h2{font-size:18px;margin:0 0 12px}.muted{color:#6d7d70;font-size:12px}label{display:block;font-size:13px;margin:10px 0 5px;font-weight:bold}input,select{width:100%;padding:11px;border:1px solid #c8d8c8;border-radius:10px;background:white;font-size:15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px;border-radius:13px;background:#edf6ec}.stat:nth-child(2){background:#fff3df}.stat:nth-child(3){background:#eaf2fb}.stat:nth-child(4){background:#f3edfa}.stat small{display:block;color:#617367}.stat strong{display:block;font-size:22px;margin-top:5px}button{border:0;border-radius:11px;padding:12px 14px;background:#21663d;color:white;font-size:15px;font-weight:bold;width:100%;margin-top:12px;cursor:pointer}button.secondary{background:white;color:#21663d;border:1px solid #21663d}.entry{border:1px solid #d5e5d5;border-radius:12px;padding:12px;margin:9px 0}.entrytop{display:flex;justify-content:space-between;gap:8px}.entrytop strong{font-size:14px}.money{font-weight:bold}.entrybottom{display:flex;justify-content:space-between;gap:8px;margin-top:9px;color:#65766a;font-size:12px}.notice{font-size:12px;color:#725b1b;background:#fff7df;border:1px solid #e7d39a;padding:11px;border-radius:10px}@media(min-width:500px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><div class="brand"><div class="logo">🌱</div><div><h1>R.P.S. कृषि फार्म</h1><p>फार्म मैनेजमेंट सिस्टम · टेस्ट ऐप</p></div></div></header>
<main><div class="card"><h2>किसान का हिसाब</h2><label for="farmer">किसान चुनें</label><select id="farmer"><option>रामपाल सिंह</option><option>सुनील कुमार</option><option>राजेश शर्मा</option></select><label for="period">महीना</label><select id="period"><option>अक्टूबर 2026</option><option>सितंबर 2026</option><option>सभी महीने</option></select></div>
<div class="stats"><div class="stat"><small>कुल काम</small><strong id="total">₹7,200</strong></div><div class="stat"><small>जमा भुगतान</small><strong id="paid">₹1,000</strong></div><div class="stat"><small>बाकी रकम</small><strong id="due">₹6,200</strong></div><div class="stat"><small>कुल एंट्री</small><strong id="count">3</strong></div></div>
<div class="card"><h2>काम का हिसाब</h2><div id="entries"></div></div>
<div class="card"><h2>नई एंट्री जोड़ें</h2><label for="work">काम का प्रकार</label><select id="work"><option>ट्रैक्टर का काम</option><option>पानी सप्लाई</option><option>खेत की जुताई</option><option>बुवाई</option><option>अन्य काम</option><option>किसान को भुगतान</option></select><label for="date">तारीख</label><input id="date" type="date" value="2026-10-27"><label for="amount">काम की रकम (₹)</label><input id="amount" type="number" min="0" value="1500"><label for="payment">जमा भुगतान (₹)</label><input id="payment" type="number" min="0" value="0"><label for="note">विवरण (वैकल्पिक)</label><input id="note" placeholder="खेत या काम की जानकारी"><button id="add">＋ हिसाब में एंट्री जोड़ें</button><button class="secondary" id="csv">रिपोर्ट डाउनलोड करें (CSV)</button><p class="notice">यह ऑफलाइन टेस्ट डेमो है। जो डेटा जोड़ेंगे, वह केवल इसी ब्राउज़र/डिवाइस में रहेगा। आपके असली Google Sheet में सेव नहीं होगा।</p></div></main>
<script>
const records=[{date:'2026-10-05',work:'गेहूँ की जुताई',amount:3500,paid:0},{date:'2026-10-12',work:'ट्रैक्टर से बुवाई',amount:2500,paid:1000},{date:'2026-10-18',work:'पानी सप्लाई',amount:1200,paid:0}];
const $=id=>document.getElementById(id),money=n=>'₹'+Number(n).toLocaleString('en-IN');
function dateShow(s){let [y,m,d]=s.split('-');return d+'-'+m+'-'+y}
function render(){$('entries').innerHTML='';records.forEach(r=>{let d=document.createElement('div');d.className='entry';d.innerHTML='<div class="entrytop"><div><strong></strong><div class="muted"></div></div><span class="money"></span></div><div class="entrybottom"><span></span><span></span></div>';d.querySelector('strong').textContent=r.work;d.querySelector('.muted').textContent=dateShow(r.date);d.querySelector('.money').textContent=money(r.amount);d.querySelector('.entrybottom span:first-child').textContent='जमा: '+money(r.paid);d.querySelector('.entrybottom span:last-child').textContent='बाकी: '+money(r.amount-r.paid);$('entries').appendChild(d)});let t=records.reduce((s,r)=>s+r.amount,0),p=records.reduce((s,r)=>s+r.paid,0);$('total').textContent=money(t);$('paid').textContent=money(p);$('due').textContent=money(t-p);$('count').textContent=records.length}
$('add').onclick=()=>{let a=Number($('amount').value),p=Number($('payment').value),dt=$('date').value;if(!dt||$('amount').value===''||$('payment').value===''||a<0||p<0||p>a){alert('सही तारीख और रकम भरें। भुगतान, काम की रकम से ज्यादा नहीं होना चाहिए।');return}records.push({date:dt,work:$('work').value+($('note').value.trim()?' — '+$('note').value.trim():''),amount:a,paid:p});$('amount').value='1500';$('payment').value='0';$('note').value='';render()};
$('csv').onclick=()=>{let rows=[['तारीख','काम','रकम','जमा भुगतान','बाकी'],...records.map(r=>[r.date,r.work,r.amount,r.paid,r.amount-r.paid])],csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='RPS-Kisan-Hisab-Test.csv';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
